[package]
name = "renlog"
version = "0.1.0"
edition = "2021"
authors = ["Akira Kawata"]
license = "MIT"

[lints.rust]
warnings = "deny"

[dependencies]
nix = { version = "0.29", features = ["term", "fs", "poll"] }
libc = "0.2"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
signal-hook = "0.3"
