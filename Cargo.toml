[package]
name = "renlog"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
nix = { version = "0.29", features = ["term", "fs"] }
libc = "0.2"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
simplelog = "0.12"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
